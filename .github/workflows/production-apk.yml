name: Build production HomeApp APK

on:
  push:
    branches:
      - main
      - "feature/**"
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Reconstruct native Android source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          parts = sorted(Path("build-source").glob("homeapp-src.part*"))
          if not parts:
              raise SystemExit("No source bundle parts found")
          encoded = "".join(part.read_text(encoding="utf-8").strip() for part in parts)
          archive = base64.b64decode(encoded, validate=True)
          print(f"Reconstructed {len(parts)} parts, {len(encoded)} base64 chars, {len(archive)} archive bytes")
          print("Archive SHA-256:", hashlib.sha256(archive).hexdigest())
          gzip.decompress(archive)
          Path("/tmp/homeapp-source.tar.gz").write_bytes(archive)
          PY
          tar -xzf /tmp/homeapp-source.tar.gz
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Run tests, lint and build signed debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK signature and metadata
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -30
          sha256sum "$APK" | tee app-debug.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeApp-production-backend-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HomeApp-build-reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
